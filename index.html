<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time For Change</title>
    <link rel="stylesheet" href="./styles/main.css">
    <script type="module" src="./js/index.js"></script>
</head>
<body>
    <header class="page-header">
        <h1 class="page-title">Пора менять!</h1>
    </header>

    <main class="main-container">
        <section class="car-list" id="car-list" aria-label="Список автомобилей">
            <button class="car-add-btn" id="car-add-btn" type="button" aria-label="Добавить автомобиль" title="Добавить автомобиль">+</button>
        </section>

        <section class="parts" aria-label="Состояние запчастей">
            <h2 class="parts__title" id="parts-title">Запчасти</h2>
            <div class="parts-grid" id="parts-grid">
                <button class="part-add-btn" id="part-add-btn" type="button" aria-label="Добавить деталь" title="Добавить деталь">+</button>
            </div>
        </section>
    </main>

    <dialog class="modal" id="car-dialog" aria-labelledby="car-dialog-title">
        <div class="modal__inner">
            <h2 class="modal__title" id="car-dialog-title">Новый автомобиль</h2>

            <form class="modal__form" id="car-form">
                <div class="modal__fields">
                    <label class="field">
                        <span class="field__label">Гос. номер</span>
                        <input class="field__input" name="govId" placeholder="A816OK 161" required>
                    </label>
                    <label class="field">
                        <span class="field__label">Марка</span>
                        <input class="field__input" name="brand" placeholder="Renault">
                    </label>
                    <label class="field">
                        <span class="field__label">Модель</span>
                        <input class="field__input" name="model" placeholder="Sandero Stepway I" required>
                    </label>
                    <label class="field">
                        <span class="field__label">Кличка</span>
                        <input class="field__input" name="name" placeholder="Ласточка">
                    </label>
                    <label class="field">
                        <span class="field__label">Пробег, км</span>
                        <input class="field__input" name="mileage" type="number" min="0" step="1" value="0" required>
                    </label>
                </div>

                <div class="modal__actions">
                    <button class="btn btn--ghost" type="button" data-close>Отмена</button>
                    <button class="btn btn--primary" type="submit">Добавить</button>
                </div>
            </form>
        </div>
    </dialog>

    <dialog class="modal" id="part-dialog" aria-labelledby="part-dialog-title">
        <div class="modal__inner">
            <h2 class="modal__title" id="part-dialog-title">Новая деталь</h2>

            <form class="modal__form" id="part-form">
                <div class="modal__fields">
                    <label class="field">
                        <span class="field__label">Название детали</span>
                        <input class="field__input" name="name" placeholder="Масло в ДВС (5W-40)" required>
                    </label>
                    <label class="field">
                        <span class="field__label">Интервал по пробегу, км</span>
                        <input class="field__input" name="mileageLimit" type="number" min="0" step="1" required>
                    </label>
                    <label class="field">
                        <span class="field__label">Интервал по времени, мес.</span>
                        <input class="field__input" name="timeLimit" type="number" min="0" step="1" required>
                    </label>
                    <label class="field">
                        <span class="field__label">Пробег при замене, км</span>
                        <input class="field__input" name="replacedAtMileage" type="number" min="0" step="1" required>
                    </label>
                    <label class="field">
                        <span class="field__label">Дата замены</span>
                        <input class="field__input" name="replacedAtDate" type="date" required>
                    </label>
                </div>

                <p class="modal__error" id="part-error" role="alert" hidden>Укажите интервал по пробегу или по времени</p>

                <div class="modal__actions">
                    <button class="btn btn--ghost" type="button" data-close>Отмена</button>
                    <button class="btn btn--primary" type="submit">Добавить</button>
                </div>
            </form>
        </div>
    </dialog>
</body>
</html>
